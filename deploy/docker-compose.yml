# Start:  cp deploy/.env.beispiel deploy/.env  →  Werte eintragen  →  docker compose -f deploy/docker-compose.yml up -d --build
services:
  assistent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"   # nur lokal; nach außen über nginx/Caddy mit HTTPS
    volumes:
      - ../wissen:/app/wissen:ro        # Wissensbasis ohne Neubau ändern (Container danach neu starten)
      - berichte:/app/berichte
    restart: unless-stopped
volumes:
  berichte:
